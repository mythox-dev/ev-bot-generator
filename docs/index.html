<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Bot Generator — POC</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --focus: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 1.5rem 1.25rem;
      border-bottom: 1px solid #334155;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .status {
      background: var(--surface);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .status p {
      margin: 0.25rem 0;
    }

    .status .ok {
      color: var(--accent);
      font-weight: 600;
    }

    button {
      width: 100%;
      font-size: 1.1rem;
      padding: 0.9rem;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #052e16;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: var(--accent-dark); }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    #counter {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin: 1rem 0;
    }

    #log {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    #log li {
      padding: 0.4rem 0;
      border-bottom: 1px solid #334155;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>EV Bot Generator</h1>
    <p style="margin: 0.25rem 0 0; color: var(--muted);">Proof of concept</p>
  </header>

  <main>
    <section class="status" aria-labelledby="status-heading">
      <h2 id="status-heading" class="visually-hidden">Connection status</h2>
      <p><span class="ok">&#9679;</span> Server reachable</p>
      <p id="ua-info">Loading device info&hellip;</p>
    </section>

    <section aria-labelledby="counter-heading">
      <h2 id="counter-heading" class="visually-hidden">Tap counter</h2>
      <div id="counter" aria-live="polite">0</div>
      <button id="tap-btn" type="button">Tap me</button>
      <ul id="log" aria-label="Activity log"></ul>
    </section>
  </main>

  <script>
    const counterEl = document.getElementById('counter');
    const btn = document.getElementById('tap-btn');
    const log = document.getElementById('log');
    const uaInfo = document.getElementById('ua-info');
    let count = 0;

    uaInfo.textContent = `Viewport: ${window.innerWidth}×${window.innerHeight}`;

    btn.addEventListener('click', () => {
      count += 1;
      counterEl.textContent = count;
      const item = document.createElement('li');
      item.textContent = `Tap #${count} at ${new Date().toLocaleTimeString()}`;
      log.prepend(item);
      while (log.children.length > 5) log.removeChild(log.lastChild);
    });
  </script>
</body>
</html>
