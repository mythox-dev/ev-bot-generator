<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EV Bot Command Builder</title>
  <meta name="description" content="Build and copy EV Bot Discord slash commands without memorizing syntax." />
  <meta name="theme-color" content="#0b1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EV Bot" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>EV Bot Command Builder</h1>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button id="tab-favorites" class="tab-btn" role="tab" aria-selected="true" aria-controls="panel-favorites" type="button">Favorites</button>
        <button id="tab-builder" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-builder" type="button">Builder</button>
      </nav>
    </header>

    <main>
      <p id="fatal-error" class="field-hint" role="alert" style="color:var(--danger);" hidden></p>

      <section id="panel-favorites" role="tabpanel" aria-labelledby="tab-favorites">
        <div id="favorites-list"></div>
      </section>

      <section id="panel-builder" role="tabpanel" aria-labelledby="tab-builder" hidden>
        <div class="field-block">
          <h2>League</h2>
          <div id="league-chips" class="chip-row"></div>
        </div>

        <div class="field-block">
          <h2>Market Group</h2>
          <div id="group-chips" class="chip-row"></div>
        </div>

        <div class="field-block">
          <h2>Markets</h2>
          <div id="markets-container"></div>
        </div>

        <div class="field-block">
          <h2>Name Filter <span class="field-hint" style="display:inline;">(optional)</span></h2>
          <input id="name-input" class="text-input" type="text" placeholder="e.g. Over" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </div>

        <div class="field-block">
          <h2>Sharps</h2>
          <div id="sharps-chips" class="chip-row"></div>
        </div>

        <div class="field-block">
          <h2>Target Book</h2>
          <select id="book-select" class="select-input"></select>
        </div>

        <div class="field-block inline-fields">
          <div>
            <h2>Min Books</h2>
            <input id="min-books-input" class="number-input" type="number" inputmode="numeric" min="0" step="1" />
          </div>
          <div>
            <h2>Min Limit</h2>
            <input id="min-limit-input" class="number-input" type="number" inputmode="numeric" min="0" step="50" />
          </div>
        </div>

        <div class="field-block">
          <div class="toggle-row">
            <label for="is-main-toggle">Main Only <span style="color:var(--muted); font-weight:400;">(is_main:true)</span></label>
            <span class="switch">
              <input id="is-main-toggle" type="checkbox" />
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </div>
        </div>

        <ul id="validation-list" class="validation-list" aria-live="polite"></ul>

        <div class="reset-row">
          <button id="reset-btn" class="btn" type="button">Reset to Defaults</button>
        </div>
      </section>
    </main>

    <div class="command-bar">
      <div id="command-text" class="command-text" aria-live="polite">/run command_name:all</div>
      <div class="command-actions">
        <button id="copy-btn" class="btn primary copy-btn" type="button">Copy Command</button>
        <button id="reset-btn-bar" class="btn reset-btn" type="button" onclick="document.getElementById('reset-btn').click()">Reset</button>
      </div>
    </div>

    <footer class="app-footer">
      EV Bot Command Builder &middot; runs entirely on your device
    </footer>
  </div>

  <script src="./data/config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
